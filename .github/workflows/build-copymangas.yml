
name: Build CopyMangas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CopyMangas Release
        run: ./gradlew :src:zh:copymangas:assembleRelease

      - name: Upload APK and JAR
        uses: actions/upload-artifact@v4
        with:
          name: CopyMangas-Build
          path: |
            src/zh/copymangas/build/outputs/apk/release/*.apk
            src/zh/copymangas/build/outputs/jar/release/*.jar
          if-no-files-found: error
