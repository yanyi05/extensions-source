
name: Build Manga160

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Manga160 Release
        run: ./gradlew :src:zh:mh160:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manga160-APK
          path: src/zh/mh160/build/outputs/apk/release/*.apk
          if-no-files-found: error

